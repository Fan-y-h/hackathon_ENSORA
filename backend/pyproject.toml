[project]
name = "ensora-backend"
version = "0.2.0"
description = "Ensora+ local-first backend (FastAPI modular monolith): planner/learning/grades + P1 source ingestion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "tzdata",  # IANA timezones on Windows (zoneinfo)
    # P1 data engineering (ingestion, sync, connectors)
    "alembic>=1.13",
    "anyio>=4",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "packaging>=24,<27",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
test = ["pytest>=8", "httpx>=0.27"]
optim = ["ortools>=9.10"]  # CP-SAT planner (T26), optional

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for the planner/learning modules (import app.*), ".." for P1 ingestion (import backend.app.*).
pythonpath = [".", ".."]
