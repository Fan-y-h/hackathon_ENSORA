[project]
name = "ensora-plus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.1",
  "anyio==4.12.1",
  "fastapi==0.165.0",
  "google-api-python-client==2.202.0",
  "google-auth-oauthlib==1.5.0",
  "keyring==25.7.0",
  "packaging>=24,<27",
  "playwright==1.65.2",
  "pydantic==2.14.4",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "SQLAlchemy==2.0.58",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.29.0"]

[tool.pytest.ini_options]
pythonpath = [".."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
