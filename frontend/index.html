<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ENSORA+</title>
    <script>
      // Apply the saved theme before the page paints (see src/app/theme.ts).
      try {
        var theme = localStorage.getItem("ensora.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body style="margin: 0">
    <!-- Startup message, replaced by React as soon as the app is drawn (never a blank page).
         System colors (Canvas, GrayText) follow the browser's light/dark mode. -->
    <div id="root"><p role="status" style="min-height: 100vh; margin: 0; display: grid; place-items: center; font-family: system-ui, sans-serif; font-size: 0.95rem; background: Canvas; color: GrayText">Chargement d'Ensora+…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
