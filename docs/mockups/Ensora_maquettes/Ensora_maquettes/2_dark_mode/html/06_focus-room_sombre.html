<!doctype html>
<html lang="fr"><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('../../fonts/Inter-Regular.woff') format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('../../fonts/Inter-Medium.woff') format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('../../fonts/Inter-SemiBold.woff') format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('../../fonts/Inter-Bold.woff') format('woff')}
html,body,button,input,select,textarea,svg text{font-family:'Inter',sans-serif}
</style>

<meta charset="utf-8">
<title>Ensora+ — Focus Room</title>

<style>
body{margin:0;background:#0B141D}
</style></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B141D; color: #E8EEF4; font-family: Inter, sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #8A98A8; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600">Focus Room · Pomodoro</span>
<span style="font-size: 15px; font-weight: 600">Économétrie</span>
</div>
<button type="button" aria-label="Quitter la session" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #22303D; background: #111c27; color: #E8EEF4; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</header>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px">
<svg width="232" height="232" viewBox="0 0 232 232" role="img" aria-label="18 minutes 42 restantes sur 25">
<circle cx="116" cy="116" r="104" fill="none" stroke="#1C2A37" stroke-width="10"></circle>
<circle cx="116" cy="116" r="104" fill="none" stroke="#F2894F" stroke-width="10" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="164" transform="rotate(-90 116 116)"></circle>
<text x="116" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="52" font-weight="600" fill="#E8EEF4">18:42</text>
<text x="116" y="148" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8A98A8">cycle 2 sur 4 · pause dans 18 min</text>
</svg>
<div style="font-family: Inter, sans-serif; font-size: 20px; font-weight: 600; text-align: center">Rappel actif — Tests d'hypothèses</div>
</div>

<section style="background: #111c27; border: 1px solid #22303D; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #8A98A8; font-weight: 600">Objectifs de la séance</div>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 32px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(127, 178, 229);"><span style="color: #8A98A8; text-decoration: line-through">24 flashcards dues</span></label>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 32px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: rgb(127, 178, 229);">Restituer le test de Wald sans notes</label>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 32px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: rgb(127, 178, 229);">Exercice 3 de l'annale 2022</label>
</section>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #22303D; background: #111c27; color: #E8EEF4; font: 500 13px Inter, sans-serif">Ambiance : piano</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #22303D; background: #111c27; color: #E8EEF4; font: 500 13px Inter, sans-serif">Ressources (3)</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #22303D; background: #111c27; color: #E8EEF4; font: 500 13px Inter, sans-serif">Note rapide</button>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button type="button" style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid #2E3E4D; background: transparent; color: #E8EEF4; font: 600 15px Inter, sans-serif">Pause</button>
<button type="button" style="flex: 1.4; min-height: 52px; border-radius: 14px; border: 0; background: #F2894F; color: #0B141D; font: 700 15px Inter, sans-serif">Terminer et s'évaluer</button>
</div>
</div>




</body></html>
